name: test

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      suite:
        description: "fast (commit checks), full (all acceptance), or stress (all repetitions)"
        required: true
        default: full
        type: choice
        options: [fast, full, stress]

permissions:
  contents: read
  actions: read

# Only obsolete runs for the same PR are cancelled. Main/release/manual runs are independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'fast')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.plan.outputs.integration }}
      stress: ${{ steps.plan.outputs.stress }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: orch/package.json
          cache: npm
          cache-dependency-path: orch/package-lock.json
      - run: npm ci
        working-directory: orch
      - id: plan
        run: node orch/tools/ci-plan.mjs --github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  commit:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: orch/package.json
          cache: npm
          cache-dependency-path: orch/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node tools/release-scan.mjs
      # Warm-up and timing: the first PowerShell/CIM query on a freshly booted hosted runner
      # was observed to take over 15 s. Tests check identity logic, not cold-boot latency.
      - name: PowerShell startup timing (before tests)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          TIMING_PHASE: before
        run: |
          $uptime = [int]((Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime).TotalSeconds
          function Measure-Ps($command) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $command | Out-Null
            $sw.ElapsedMilliseconds
          }
          $startMs = @(1..3 | ForEach-Object { Measure-Ps '1' })
          $cimMs = @(1..3 | ForEach-Object { Measure-Ps "Get-CimInstance Win32_Process -Filter 'ProcessId=$PID' | Out-Null" })
          'PS_TIMING ' + (@{ phase = $env:TIMING_PHASE; uptimeSeconds = $uptime; startMs = $startMs; cimMs = $cimMs } | ConvertTo-Json -Compress)
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commit-${{ matrix.os }}
          path: orch/.state-test/ci-results/*.json
          retention-days: 7

  integration:
    needs: [plan, commit]
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.plan.outputs.integration != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [windows-latest, ubuntu-latest]
        group: ${{ fromJSON(needs.plan.outputs.integration || '[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: orch/package.json
          cache: npm
          cache-dependency-path: orch/package-lock.json
      - run: npm ci
      # Warm-up and timing: times Windows PowerShell startup against VM uptime and warms
      # PowerShell/CIM, so tests check identity logic rather than cold-boot latency.
      - name: PowerShell startup timing (before tests)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          TIMING_PHASE: before
        run: |
          $uptime = [int]((Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime).TotalSeconds
          function Measure-Ps($command) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $command | Out-Null
            $sw.ElapsedMilliseconds
          }
          $startMs = @(1..3 | ForEach-Object { Measure-Ps '1' })
          $cimMs = @(1..3 | ForEach-Object { Measure-Ps "Get-CimInstance Win32_Process -Filter 'ProcessId=$PID' | Out-Null" })
          'PS_TIMING ' + (@{ phase = $env:TIMING_PHASE; uptimeSeconds = $uptime; startMs = $startMs; cimMs = $cimMs } | ConvertTo-Json -Compress)
      - run: node tools/ci-run.mjs --mode integration --group "$CI_GROUP"
        shell: bash
        env:
          CI_GROUP: ${{ matrix.group }}
      - name: PowerShell startup timing (after tests)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          TIMING_PHASE: after
        run: |
          $uptime = [int]((Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime).TotalSeconds
          function Measure-Ps($command) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $command | Out-Null
            $sw.ElapsedMilliseconds
          }
          $startMs = @(1..3 | ForEach-Object { Measure-Ps '1' })
          $cimMs = @(1..3 | ForEach-Object { Measure-Ps "Get-CimInstance Win32_Process -Filter 'ProcessId=$PID' | Out-Null" })
          'PS_TIMING ' + (@{ phase = $env:TIMING_PHASE; uptimeSeconds = $uptime; startMs = $startMs; cimMs = $cimMs } | ConvertTo-Json -Compress)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.group }}-${{ matrix.os }}
          path: orch/.state-test/ci-results/*.json
          retention-days: 7

  stress:
    needs: [plan, commit, integration]
    if: needs.plan.outputs.stress == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: orch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: orch/package.json
          cache: npm
          cache-dependency-path: orch/package-lock.json
      - run: npm ci
      - run: npm run test:stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.os }}
          path: orch/.state-test/ci-results/*.json
          retention-days: 7

  full:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'fast')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: orch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: orch/package.json
          cache: npm
          cache-dependency-path: orch/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node tools/release-scan.mjs
      - if: inputs.suite != 'stress'
        run: npm run test:full
      - if: inputs.suite == 'stress'
        run: npm run test:stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.os }}
          path: orch/.state-test/ci-results/*.json
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [plan, commit, integration, stress, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: orch/package.json
      - run: npm ci
        working-directory: orch
      - run: node orch/tools/ci-run.mjs --gate
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_FULL_REQUIRED: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'fast') }}
          CI_INTEGRATION_REQUIRED: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && needs.plan.outputs.integration != '[]' }}
          CI_STRESS_REQUIRED: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && needs.plan.outputs.stress == 'true' }}
