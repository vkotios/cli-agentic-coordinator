name: test diagnostics

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Normal model-free suite
        required: true
        default: fast
        type: choice
        options: [fast]
      source_ref:
        description: Exact 40-character source commit to test unchanged
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    # Windows only for now: orch relies on named pipes, process-tree termination and PowerShell.
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source/orch
    env:
      SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Verify exact source
        shell: pwsh
        run: |
          $env:DIAGNOSTIC_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP 'orch-ci-diagnostics'
          "DIAGNOSTIC_OUTPUT_DIR=$env:DIAGNOSTIC_OUTPUT_DIR" | Add-Content $env:GITHUB_ENV
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Exact source SHA required' }
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:SOURCE_SHA) { throw 'Source SHA mismatch' }
          if (git status --porcelain) { throw 'Source checkout is not clean' }
          New-Item -ItemType Directory -Force $env:DIAGNOSTIC_OUTPUT_DIR | Out-Null
          @{ head=$actual; tree=(git rev-parse 'HEAD^{tree}') } | ConvertTo-Json | Set-Content (Join-Path $env:DIAGNOSTIC_OUTPUT_DIR 'source-before.json')
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/orch/package.json
          cache: npm
          cache-dependency-path: source/orch/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run unchanged suite with resource samples
        shell: pwsh
        run: |
          node "$env:GITHUB_WORKSPACE/diagnostics/.github/scripts/diagnose-tests.mjs" pwsh.exe -NoLogo -NoProfile -NonInteractive -Command '& npm.cmd test; exit $LASTEXITCODE'
          exit $LASTEXITCODE
      - name: Record final source state
        if: always()
        shell: pwsh
        run: |
          $env:DIAGNOSTIC_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP 'orch-ci-diagnostics'
          New-Item -ItemType Directory -Force $env:DIAGNOSTIC_OUTPUT_DIR | Out-Null
          $head = git rev-parse HEAD
          $changes = @(git status --porcelain)
          @{ head=$head; changes=$changes } | ConvertTo-Json | Set-Content (Join-Path $env:DIAGNOSTIC_OUTPUT_DIR 'source-after.json')
          if ($head -cne $env:SOURCE_SHA -or $changes.Count -ne 0) { throw 'Source identity or contents changed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/orch-ci-diagnostics
          if-no-files-found: error
          retention-days: 14
